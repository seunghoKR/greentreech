<!-- =========================================================================
   [푸른나무교회 - 섬기는 사람들 (담임목사 소개) HTML]
   라이믹스 페이지 편집에서 'HTML 편집' 모드로 전환 후 
   아래 소스 전체를 복사해서 붙여넣으시면 됩니다!
   ========================================================================= -->

<div class="gtc-doc-content" style="max-width: 900px; margin: 0 auto; padding: 20px 10px;">

  <!-- 상단 페이지 헤더 -->
  <div class="gtc-section-header" style="text-align: center; margin-bottom: 40px;">
    <h2 class="gtc-section-title" style="font-size: 1.8rem; font-weight: 700; color: #222; margin-bottom: 10px;">섬기는 사람들</h2>
    <p class="gtc-section-sub" style="font-size: 1.05rem; color: #666;">푸른나무교회 공동체를 섬기는 교역자를 소개합니다</p>
  </div>

  <!-- 담임목사 프로필 카드 -->
  <div class="gtc-pastor-card" style="background: #ffffff; border-radius: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px rgba(0,0,0,0.06); padding: 40px 35px; margin-bottom: 40px;">
    
    <div class="gtc-pastor-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 35px; align-items: center;">
      
      <!-- 1. 담임목사 사진 영역 -->
      <div class="gtc-pastor-photo-wrapper" style="text-align: center;">
        <!-- 목사님 사진 파일이 있으시면 src="사진주소.jpg" 로 변경하세요! -->
        <img 
          src="https://greentreech.kr/files/attach/images/126/323624d6d9f2df003eb925c3dc16624e.png" 
          alt="심민보 담임목사" 
          class="gtc-pastor-photo"
          style="width: 100%; max-width: 240px; height: 290px; object-fit: cover; border-radius: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 4px solid #ffffff; outline: 1px solid #e2e8f0; background-color: #f0f4fa; margin: 0 auto; display: block;"
          onerror="this.onerror=null; this.src='https://via.placeholder.com/240x290/f0f4fa/5377b8?text=Pastor+Photo';"
        />
        <div style="margin-top: 12px; font-size: 0.88rem; color: #888; text-align: center;">
          <i class="fas fa-camera" style="margin-right: 4px;"></i> 사진을 자유롭게 교체하실 수 있습니다
        </div>
      </div>

      <!-- 2. 담임목사 정보 (학력 & 경력) -->
      <div>
        <div class="gtc-pastor-info-header" style="margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #f0f4fa;">
          <span class="gtc-pastor-badge" style="display: inline-block; font-size: 0.9rem; font-weight: 700; color: #7399da; background-color: #f0f4fa; padding: 4px 14px; border-radius: 20px; margin-bottom: 8px;">담임목사 소개</span>
          <h3 class="gtc-pastor-name" style="font-size: 2rem; font-weight: 700; color: #1a202c; margin: 0;">심민보 <span style="font-size: 1.3rem; font-weight: 500; color: #5377b8; margin-left: 4px;">목사</span></h3>
        </div>

        <!-- 학력 섹션 -->
        <div style="margin-bottom: 25px;">
          <h4 class="gtc-pastor-section-title" style="font-size: 1.18rem; font-weight: 700; color: #5377b8; margin: 0 0 12px 0; display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-graduation-cap" style="color: #7399da;"></i> 학력
          </h4>
          <ul class="gtc-history-list" style="list-style: none; padding: 0; margin: 0; font-size: 1.05rem; color: #444; line-height: 1.8;">
            <li style="margin-bottom: 6px; padding-left: 18px; position: relative;">
              <span style="position: absolute; left: 0; color: #7399da;">•</span> 침례신학대학 (B.A)
            </li>
            <li style="margin-bottom: 6px; padding-left: 18px; position: relative;">
              <span style="position: absolute; left: 0; color: #7399da;">•</span> Canadian Southern Baptist Seminary (M.div)
            </li>
          </ul>
        </div>

        <!-- 경력 섹션 -->
        <div>
          <h4 class="gtc-pastor-section-title" style="font-size: 1.18rem; font-weight: 700; color: #5377b8; margin: 0 0 12px 0; display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-briefcase" style="color: #7399da;"></i> 경력
          </h4>
          <ul class="gtc-history-list" style="list-style: none; padding: 0; margin: 0; font-size: 1.05rem; color: #444; line-height: 1.8;">
            <li style="margin-bottom: 6px; padding-left: 18px; position: relative;">
              <span style="position: absolute; left: 0; color: #7399da;">•</span> <strong style="color: #666;">전)</strong> The New Way Baptist Church (Edmonton Canada) 담임목사
            </li>
            <li style="margin-bottom: 6px; padding-left: 18px; position: relative;">
              <span style="position: absolute; left: 0; color: #7399da;">•</span> <strong style="color: #4A7C59;">현)</strong> 푸른나무교회 (익산) 담임목사
            </li>
          </ul>
        </div>

      </div>

    </div>

  </div>

  <!-- 인사말 콜아웃 박스 -->
  <div class="gtc-callout green" style="background-color: #EBF4EE; border-left: 5px solid #4A7C59; border-radius: 12px; padding: 22px 28px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04);">
    <p style="margin: 0; font-size: 1.1rem; color: #2D5036; font-weight: 500; line-height: 1.7;">
      "하나님의 따뜻한 사랑 안에서 성도 한 분 한 분을 기쁨으로 섬기겠습니다."
    </p>
  </div>

</div>
